# issuance-web CI — 이벤트 페이지(쿠폰 앱) 화면 (인프라 플랜 5-2 · 런북 9단계)
#   MR   : test(타입 검사는 build 에 포함) · build
#   main : 같음 + dist/ 산출물을 7일 보관 → upload-template(수동, 보호 Runner)이 needs: [build] 로 받아 템플릿 버킷에 올린다
#
# 배포 경로(CD):
#   dist/ → s3://tetra-templates-dev/apps/coupon/  (보호 Runner, main 만)
#   → 이벤트 승인(WF1-2) 때 테넌트 버킷 events/live/<event_id>/ 로 복사 · event.json 생성
#   업로드 규칙: app-assets/** 는 Cache-Control "public, max-age=31536000, immutable" 를 먼저,
#              index.html 등 해시 없는 파일은 "public, max-age=0, s-maxage=60" 를 나중에. 옛 app-assets 는 지우지 않는다
#
# Runner: test·build 는 general(AWS 권한 없음), upload-template 만 protected(인스턴스 프로파일로 S3 쓰기)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # MR 이 열린 브랜치는 MR 파이프라인만 (중복 방지)
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [test, build, deploy]

default:
  image: node:22.22.0-alpine # .nvmrc = 22
  tags: [general]
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

test:
  stage: test
  script:
    - npm run test # vitest run

# 잡 이름 build 는 CD 가 needs 로 참조한다 — 바꾸면 CD 도 함께
build:
  stage: build
  needs: [] # test 와 병렬 (빌드에 tsc 타입 검사 포함)
  script:
    - npm run build # tsc -b && vite build
    # 배포 규칙 확인: 루트에 index.html, 해시 파일은 app-assets/, 소스맵 없음(원본 코드 공개 방지)
    - test -f dist/index.html
    - test -d dist/app-assets
    - |
      if find dist -name '*.map' | grep -q .; then
        echo "소스맵(.map)이 dist 에 있다 — vite.config.ts build.sourcemap 확인"; exit 1
      fi
    - find dist -type f | sort
  artifacts:
    name: issuance-web-$CI_COMMIT_SHORT_SHA
    paths: [dist/]
    expire_in: 7 days

upload-template:
  stage: deploy
  needs: [build]
  tags: [protected]
  image:
    name: amazon/aws-cli:2.27.0
    entrypoint: [""]
  cache: []
  before_script: [] # default 의 npm ci 를 끈다
  variables:
    TEMPLATE_BUCKET: tetra-templates-dev
    TEMPLATE_PREFIX: apps/coupon
    AWS_DEFAULT_REGION: ap-northeast-2
  script:
    - test -f dist/index.html && test -d dist/app-assets
    - aws sts get-caller-identity --query Account --output text
    # ① 해시 파일 먼저
    - aws s3 cp dist/app-assets/ "s3://$TEMPLATE_BUCKET/$TEMPLATE_PREFIX/app-assets/" --recursive
      --cache-control "public, max-age=31536000, immutable"
    # ② 해시 없는 파일(index.html 등) 나중에
    - aws s3 cp dist/ "s3://$TEMPLATE_BUCKET/$TEMPLATE_PREFIX/" --recursive --exclude "app-assets/*"
      --cache-control "public, max-age=0, s-maxage=60"
    # 확인
    - aws s3api head-object --bucket "$TEMPLATE_BUCKET" --key "$TEMPLATE_PREFIX/index.html"
      --query "[CacheControl, ContentType, LastModified]" --output text
    - aws s3 ls "s3://$TEMPLATE_BUCKET/$TEMPLATE_PREFIX/" --recursive | head -20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
